[project]
name = "inkflow"
version = "0.1.0"
description = "A LangGraph learning project for building a content workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "openai>=2.0,<3.0",
    "rich>=13.7,<15.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "uvicorn>=0.30,<1.0",
    "tomlkit>=0.13,<1.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]
